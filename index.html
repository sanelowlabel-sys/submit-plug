    <script>
      // Fix for sandboxed iframe environments where fetch is a getter-only property on Window.prototype
      (function() {
        try {
          var _rawFetch = typeof window !== 'undefined' ? window.fetch : null;
          var _fetch = _rawFetch ? function() {
            return _rawFetch.apply(window, arguments);
          } : null;

          var desc = {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            } catch (e) {}
          }
          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', desc);
            } catch (e) {}
          }
          if (typeof globalThis !== 'undefined') {
            try {
              Object.defineProperty(globalThis, 'fetch', desc);
            } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
